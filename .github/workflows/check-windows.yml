name: Windows Runtime Check

on:
  pull_request:
    paths:
      - ".github/workflows/check-windows.yml"
      - "server/**"
      - "web/**"
      - "scripts/package-tutti-app.mjs"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir server type-check
      - run: pnpm build:web
      - run: pnpm --dir server test
      - run: pnpm package:tutti-app
